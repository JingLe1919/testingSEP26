<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript</title>
        <link rel="icon" href="vaananjk.jpg" type="image/jpg">
        <meta name=viewport content=width=device-width, inital-scale=1.0>

        <script>
            function showMessage(){
                alert("Welcome to my website");
            }
        </script>
    </head>
    <body>
        <h3>
            This is an example of using JavaScript - Event onclick attribute in HTML.
        </h3>    
        <p>
            Click on the following button to see the effect.
        </p>
        <button onclick="showMessage()">Click Me!</button>
    </body>
</html>
