<!DOCTYPE html>
<html>
    <head>
        <title>Form - Text Input</title>
        <link rel=icon href=vaananjk.jpg type=image/jpg>
        <meta name=viewport content=width=device-width, initial-scale=1.0>
    </head>

    <body topmargin="50" >
        <center>
            <table style="background-color: powderblue; color:#696969; font-family:'Times New Roman', Times, serif;"s>
            <form>
                <p>
                    <caption>Personal Details:</caption>
                    <tr>
                        <td style="background-color:darkblue; color:white;">First Name:</td>
                        <td><input  type="text" name=fname></td>
                    </tr>
                    <tr>
                        <td style="background-color:darkblue; color:white;">Last Name:</td><td><input  type="text" name=lname></td>
                    </tr>
                    <tr>
                        <td style="background-color:darkblue; color:white;">Gender:</td>
                        <td><input type=radio name=gender value=Male> Male
                        <input type=radio name=gender value=Female> Female</td>
                    </tr>
                    <tr>
                       <td style="padding-right: 60px; background-color: darkblue; color:white;">Choose your favourite subjects:</td>
                        <td><input type=checkbox name=fav_sub value=DCS4103>DCS4103
                        <input type=checkbox name=fav_sub value=DCS3003>DCS3003
                        <input type=checkbox name=fav_sub value=MST1003>MST1003
                        <input type=checkbox name=fav_sub value=MST2003>MST2003</td>
                    </tr>
                    <tr>
                        <td style="background-color:darkblue; color:white;">Address:</td>
                        <td><textarea rows=4 cols=30 name=address></textarea></td>
                    </tr>
                    <tr>
                        <td style="background-color:darkblue; color:white;">Date of Birth:</td>
                        <td><input type=date name=dob></td>
                    </tr>
                    <tr>
                        <td style="background-color:darkblue; color:white;">Login Password:</td>
                        <td><input type=password name=loginpass></td>
                    </tr>
                    <tr>
                    <td style="background-color:darkblue; color:white;" >Course:</td>
                    <td><select>
                        <option value="0">- List of Course -</option>
                        <option value="DCS" selected>Diploma In Computer Science</option>
                        <optgroup label="Diploma In Computer Science">
                            <option value="DCS_S1">Semester 1</option>
                            <option value="DCS_S2">Semester 2</option>
                            <option value="DCS_S3">Semester 3</option>
                            <option value="DCS_S4">Semester 4</option>
                            <option value="DCS_S5">Semester 5</option>
                            <option value="DCS_S6">Semester 6</option>
                        </optgroup>
                        <option value="DIB">Diploma In Business</option>
                        <option value="DAS">Diploma In Airline Services</option>
                    </select>
                    </td>
                    </tr>
                    <tr height="60">
                    </tr>
                    <tr>
                        <td></td>
                        <td><input type=submit value=Submit>
                        <input type=reset value=Reset></td>
                    </tr>   
                </p>
            </form>
            </table>
        </center>
    </body>
</html>
