<!DOCTYPE html>
<html>
    <head>
        <title>Form - Text Input</title>
        <link rel=icon href=vaananjk.jpg type=image/jpg>
        <meta name=viewport content=width=device-width, initial-scale=1.0>
    </head>

    <body topmargin="50">
        <center>
            <form>
                <p style="background-color: powderblue; color:#696969; font-family: verdana; font-size: 160%; text-align: center;
                width: 60%; height:40%;">
                <br>
                    Personal Details:
                    <br><br>
                    First Name:<input  type="text" name=fname size=40 maxlength=5>
                    <br>
                    Last Name:<input  type="text" name=lname>
                    <br>
                    <br>
                    Gender:
                    <input type=radio name=gender value=Male> Male
                    <input type=radio name=gender value=Female> Female
                    <br>
                    <br>
                    Choose your favourite subjects: <br>
                    <input type=checkbox name=fav_sub value=DCS4103>DCS4103<br>
                    <input type=checkbox name=fav_sub value=DCS3003>DCS3003<br>
                    <input type=checkbox name=fav_sub value=MST1003>MST1003<br>
                    <input type=checkbox name=fav_sub value=MST2003>MST2003<br>
                    <br>
                    Address:
                    <textarea rows=4 cols=30 name=address></textarea>
                    <br>
                    <br>
                </p>
            </form>
        </center>
    </body>
</html>
