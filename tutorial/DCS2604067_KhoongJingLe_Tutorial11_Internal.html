<!DOCTYPE html>
<html>
<head>
<title>Internal CSS Tutorial 11</title>
<link rel=icon href=vaananjk.jpg type=image/jpg>
<meta name=viewport content=width=device-width, initial-scale=1.0>
<style>
  /* Heading styles */
  h1 {
    outline-style: solid;
    outline-color: green;
    outline-width: 5px;
    background-color: tomato;
    width: fit-content;
    padding: 25px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
  }

  /* Paragraph classes */
  .uppercase-text {
    text-transform: uppercase;
  }

  .highlight-word {
    font-weight: bold;
    color: darkblue;
  }

  .bordered-box {
    border-style: double;
    border-radius: 10px;
    border-color: red;
    border-width: 5px;
    padding: 15px;
  }
</style>
</head>
<body>

<h1>
JavaScript
</h1>

<p class="uppercase-text">
<span class="highlight-word">JavaScript</span> is a scripting or programming language that allows you to implement complex features on web pages.</p>
<p>
It works seamlessly alongside HTML and CSS
</p>
<p class="bordered-box">
JavaScript's widespread applications in web, mobile app, and game development make it a valueable language to learn.  
</p>

</body>
</html>
