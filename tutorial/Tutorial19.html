<!DOCTYPE html>
<html>
    <head>
        <title>Form - Text Input</title>
        <link rel=icon href=vaananjk.jpg type=image/jpg>
        <meta name=viewport content=width=device-width, initial-scale=1.0>
                <style>
            .course{
                padding-right:30px;
            }

            .subject{
                margin-left:5%;
            }

            .submit{
                margin-right:3%;
            }

            .buttons{
                margin-top:3%;
                padding-bottom:5%;
            }

        </style>
        <script>
            const subjectbycourse = {
                DCS :["DCS 3003", "DCS 2203", "DCS 5003", "MST 1003"],
                DIB :["DIB 1303", "DIB 2403"],
                DAS :["DAS 1113", "DAS 5313"]
            };

            function updateSubject(){
                const course = document.getElementById("course").value;
                const subject = document.getElementById("subject");

                subject.innerHTML = '<option value="">--Select a Subject--</option>';

                if (!course){
                    subject.disabled = true;
                    return;
                }

                subjectbycourse[course].forEach(function (sub){
                    const option = document.createElement("option");
                    option.value = sub;
                    option.textContent = sub;
                    subject.appendChild(option);
                });

                subject.disabled = false;
            }
        </script>
    </head>

    <body topmargin="50">
        <center>
            <form style="background-color: powderblue; color:#696969; font-family: verdana; font-size: 160%; text-align: center;
                width: 60%; height:40%;">
                <p>
                <br>
                    Personal Details:
                    <br><br>
                    First Name:<input  type="text" name=fname size=40 maxlength=5>
                    <br>
                    Last Name:<input  type="text" name=lname>
                    <br>
                    <br>
                    Gender:
                    <input type=radio name=gender value=Male> Male
                    <input type=radio name=gender value=Female> Female
                    <br>
                    <br>
                    Choose your favourite subjects: <br>
                    <input type=checkbox name=fav_sub value=DCS4103>DCS4103<br>
                    <input type=checkbox name=fav_sub value=DCS3003>DCS3003<br>
                    <input type=checkbox name=fav_sub value=MST1003>MST1003<br>
                    <input type=checkbox name=fav_sub value=MST2003>MST2003<br>
                    <br>
                    Address:
                    <textarea rows=4 cols=30 name=address></textarea>
                    <br>
                    <div align="center">
                        <label class="course" for="course">Course: </label>
                        <select id="course" name="course" onchange="updateSubject()">
                            <option value="">--Select a Course--</option>
                            <option value="DCS">DCS</option>
                            <option value="DIB">DIB</option>
                            <option value="DAS">DAS</option>
                        </select>

                        <label class="subject" for="subject">Subject: </label>
                        <select id="subject" name="Subject" disabled>
                            <option value="">--Select a Subject--</option>
                            <option value="DCS 3003">DCS 3003</option>
                            <option value="DCS 2203">DCS 2203</option>
                            <option value="DCS 5003">DCS 5003</option>
                            <option value="MST 1003">MST 1003</option>
                            <option value="DIB 1303">DIB 1303</option>
                            <option value="DIB 2403">DIB 2403</option>
                            <option value="DAS 1113">DAS 1113</option>
                            <option value="DAS 5313">DAS 5313</option>

                        </select>
                    </div>
                    <div class="buttons" align="center">
                        <input type="submit" name="submit" class="submit" value="Submit">
                        <input type="reset" name="reset" value="Reset">
                    </div>
                    </p>
            </form>
        </center>
    </body>
</html>
