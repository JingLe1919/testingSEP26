<!DOCTYPE html>
<html>
<head>
<title>Inline CSS Tutorial 11</title>
<link rel=icon href=vaananjk.jpg type=image/jpg>
<meta name=viewport content=width=device-width, initial-scale=1.0>
</head>
<body>

<h1 style="
    outline-style:solid; /* Sets the outline style to a solid line */
    outline-color:green; /* Colors the outer outline green */
    outline-width:5px; /* Sets the thickness of the outline to 5 pixels */
    background-color:tomato; /* Fills the heading background with a tomato-red color */
    width:fit-content; /* Shrinks the heading background width to fit only the text */
    padding:25px; /* Adds 25 pixels of space inside the heading around the text */
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); /* Adds a soft drop shadow behind the text */
">
JavaScript
</h1>
<p style="
    text-transform: uppercase; /* Converts all text in this paragraph to UPPERCASE letters */
">
<font style="
    font-weight: bold; /* Makes the font text extra bold */
    color: darkblue; /* Changes the text color of 'JavaScript' to dark blue */
">JavaScript</font> is a scripting or programming language that allows you to implement complex features on web pages.</p>

<p>
It works seamlessly alongside HTML and CSS
</p>

<p style="
    border-style:double; /* Sets a double-line border around the paragraph */
    border-radius:10px; /* Rounds the corners of the border by 10 pixels */
    border-color:red; /* Sets the border color to red */
    border-width:5px; /* Sets the border thickness to 5 pixels */
    padding:15px; /* Adds 15 pixels of spacing between the text and its border */
">
JavaScript's widespread applications in web, mobile app, and game development make it a valueable language to learn.  
</p>

</body>
</html>
